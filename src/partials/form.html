<div class="surface">
          <form class="check-form" method="post" action="#" novalidate data-check-form data-endpoint="" data-fallback-email="hello@firemarktech.com">
            <div class="error-summary" role="alert" tabindex="-1" aria-labelledby="err-h" data-error-summary hidden>
              <h3 id="err-h">Fix these to send your request</h3>
              <ul></ul>
            </div>
            <p class="form-fine" style="margin-bottom: 1rem">Fields marked <span aria-hidden="true">*</span> are required.</p>
            <div class="form-grid">
              <div class="field">
                <label for="f-name">Your name<span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
                <input id="f-name" name="name" type="text" autocomplete="name" required>
                <svg class="valid-mark" aria-hidden="true"><use href="#i-check-circle"/></svg>
              </div>
              <div class="field">
                <label for="f-business">Business name<span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
                <input id="f-business" name="business" type="text" autocomplete="organization" required>
                <svg class="valid-mark" aria-hidden="true"><use href="#i-check-circle"/></svg>
              </div>
              <div class="field">
                <label for="f-email">Email<span class="req" aria-hidden="true">*</span><span class="visually-hidden"> (required)</span></label>
                <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required>
                <svg class="valid-mark" aria-hidden="true"><use href="#i-check-circle"/></svg>
              </div>
              <div class="field">
                <label for="f-phone">Phone <span class="opt">(optional)</span></label>
                <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
              </div>
              <div class="field field-full">
                <label for="f-site">Website or Google listing <span class="opt">(optional)</span></label>
                <input id="f-site" name="site" type="text" inputmode="url" autocomplete="url" aria-describedby="f-site-hint">
                <span class="hint" id="f-site-hint">Paste a link if you have one. No link is fine too. That's what the check is for.</span>
              </div>
              <div class="field field-full">
                <label for="f-note">Anything Firemark should know? <span class="opt">(optional)</span></label>
                <textarea id="f-note" name="note" maxlength="800"></textarea>
              </div>
              <div class="visually-hidden" aria-hidden="true">
                <label for="f-trap">Leave this field empty</label>
                <input id="f-trap" name="fm_trap_field" type="text" tabindex="-1" autocomplete="off">
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-flame" type="submit">Request my free check</button>
              <p class="form-fine">Your details are only used for your free check and to reply to you. See the <a href="privacy.html">privacy page</a>.</p>
              <p class="form-status" role="status" aria-live="polite" data-form-status></p>
            </div>
          </form>
        </div>
